name: Checks

# Runs the Python tests on every pull request and on main, so a pull request
# that breaks them shows a red check before it is merged.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # The release list brings cryptography, which test_committed_certs.py needs.
        run: pip install --require-hashes -r requirements-release.txt -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest tests -q
