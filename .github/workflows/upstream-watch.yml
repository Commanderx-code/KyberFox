name: Upstream watch

# Every 3 hours: look for a newer Firefox. When there is one, bump pins.toml on
# the branch upstream/firefox-<version>, assemble the tree with failed patches
# allowed, and open a pull request with the failed patch list and the 72-hour
# deadline. docs/upstream-watch.md explains the follow-up.
# workflow_dispatch needs this file on main.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The push at the end needs the token; no later step runs fetched code.
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check upstream
        id: check
        run: |
          python -m tools.upstream_watch --check | tee check.json
          {
            echo "newer=$(jq -r '.firefox.newer' check.json)"
            echo "version=$(jq -r '.firefox.latest' check.json)"
            echo "security=$(jq -r '.firefox.security' check.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Look for an existing pull request
        if: steps.check.outputs.newer == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: upstream/firefox-${{ steps.check.outputs.version }}
        run: |
          found=$(gh pr list --head "$BRANCH" --state all --json number --jq length)
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != "0" ]; then
            echo "A pull request for $BRANCH already exists; nothing to do."
          fi

      - name: Bump pins and assemble
        if: steps.check.outputs.newer == 'true' && steps.existing.outputs.found == '0'
        run: python -m tools.upstream_watch --bump

      - name: Open the pull request
        if: steps.check.outputs.newer == 'true' && steps.existing.outputs.found == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          SECURITY: ${{ steps.check.outputs.security }}
        run: |
          branch="upstream/firefox-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pins.toml
          git commit -m "Bump Firefox to $VERSION"
          git push origin "$branch"

          if [ "$SECURITY" = "true" ]; then sec=yes; else sec=no; fi
          deadline=$(date -u -d "+72 hours" +%Y-%m-%dT%H:%MZ)
          {
            echo "Security release: $sec"
            echo "Deadline: $deadline"
            echo
            cat upstream-watch-report.md
          } > body.md

          labels=()
          existing=$(gh label list --json name --jq ".[].name")
          for want in upstream "$([ "$SECURITY" = "true" ] && echo security)"; do
            if [ -n "$want" ] && printf '%s\n' "$existing" | grep -qx "$want"; then
              labels+=(--label "$want")
            fi
          done

          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Bump Firefox to $VERSION" --body-file body.md "${labels[@]}"
