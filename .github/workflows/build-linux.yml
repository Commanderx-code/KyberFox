name: Build Linux

# Build gate: proves a full Linux build fits a free GitHub runner.
# workflow_dispatch needs this file on main, so runs before the merge start
# from a push to the build-gate branch. workflow_call lets release workflows reuse it.
on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [build-gate]

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Disk and memory before freeing space
        run: |
          df -h
          free -h

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swap
        # 4 cores and 15 GB are tight for Firefox; without extra swap the runner
        # dies under memory pressure and the job ends as "The operation was canceled".
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true

      - name: Disk and memory after freeing space
        run: |
          df -h
          free -h
          # Sample used disk space every 30 seconds so the peak can be reported.
          sample() {
            while true; do
              df -B1M --output=used / | tail -n 1 | tr -d " " >> "$RUNNER_TEMP/disk-samples"
              sleep 30
            done
          }
          export -f sample
          nohup bash -c sample >/dev/null 2>&1 &

      - name: Assemble source tree
        run: make assemble

      - name: Release guard
        run: make check-forbidden

      - name: Install build dependencies
        working-directory: work/tree
        run: ./mach --no-interactive bootstrap --application-choice=browser

      - name: Write CI mozconfig
        run: |
          {
            echo ". \"$GITHUB_WORKSPACE/mozconfigs/linux\""
            echo "ac_add_options --with-ccache=$SCCACHE_PATH"
          } > "$RUNNER_TEMP/mozconfig"
          cat "$RUNNER_TEMP/mozconfig"
          echo "MOZCONFIG=$RUNNER_TEMP/mozconfig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          date -u
          make build
          date -u

      - name: Disk and memory after build
        if: ${{ !cancelled() }}
        run: |
          df -h
          free -h
          "$SCCACHE_PATH" --show-stats

      - name: Package
        run: make package

      - name: Report peak disk use
        if: ${{ !cancelled() }}
        run: |
          peak=$(sort -n "$RUNNER_TEMP/disk-samples" | tail -n 1)
          echo "Peak disk used on /: ${peak} MiB"
          echo "Peak disk used on /: ${peak} MiB" >> "$GITHUB_STEP_SUMMARY"
          df -h

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyberfox-linux-x86_64
          path: work/tree/obj-*/dist/*.linux-x86_64.tar.*
          if-no-files-found: error
