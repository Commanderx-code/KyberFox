name: Build Linux

# Build gate: proves a full Linux build fits a free GitHub runner.
# workflow_dispatch needs this file on main, so runs before the merge start
# from a push to the build-gate branch. workflow_call lets release workflows reuse it.
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      disabled-skins:
        description: Comma-separated skin ids to ship disabled (themes/status.json); empty keeps the committed file
        required: false
        type: string
        default: ""
    secrets:
      KYBERFOX_SAFEBROWSING_KEY:
        description: Google Safe Browsing API key; empty builds without Safe Browsing lists
        required: false
  push:
    branches: [build-gate]

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCCACHE_GHA_ENABLED: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Disk and memory before freeing space
        run: |
          df -h
          free -h

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swap
        # 4 cores and 15 GB are tight for Firefox; without extra swap the runner
        # dies under memory pressure and the job ends as "The operation was canceled".
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true

      - name: Disk and memory after freeing space
        run: |
          df -h
          free -h
          # Sample used disk space every 30 seconds so the peak can be reported.
          sample() {
            while true; do
              df -B1M --output=used / | tail -n 1 | tr -d " " >> "$RUNNER_TEMP/disk-samples"
              sleep 30
            done
          }
          export -f sample
          nohup bash -c sample >/dev/null 2>&1 &

      # Release builds only: writes themes/status.json into the checkout (nothing is committed).
      - name: Disable skins
        if: ${{ inputs.disabled-skins != '' }}
        env:
          DISABLED_SKINS: ${{ inputs.disabled-skins }}
        run: python3 -m tools.set_disabled_skins "$DISABLED_SKINS"

      - name: Assemble source tree
        run: make assemble

      - name: Release guard
        run: |
          make check-forbidden
          make check-strict

      - name: Install build dependencies
        working-directory: work/tree
        run: ./mach --no-interactive bootstrap --application-choice=browser

      # The key is embedded in the binary, so the build job may see it. It is
      # written outside the checkout and never echoed or uploaded.
      - name: Safe Browsing key
        env:
          SAFEBROWSING_KEY: ${{ secrets.KYBERFOX_SAFEBROWSING_KEY }}
        run: |
          if [ -z "$SAFEBROWSING_KEY" ]; then
            echo "::warning::KYBERFOX_SAFEBROWSING_KEY is not set: this build ships without Safe Browsing lists."
            exit 0
          fi
          keyfile="$RUNNER_TEMP/safebrowsing.key"
          (umask 077 && printf '%s' "$SAFEBROWSING_KEY" > "$keyfile")
          echo "KYBERFOX_SAFEBROWSING_KEYFILE=$keyfile" >> "$GITHUB_ENV"

      - name: Write CI mozconfig
        run: |
          {
            echo ". \"$GITHUB_WORKSPACE/mozconfigs/linux\""
            echo "ac_add_options --with-ccache=$SCCACHE_PATH"
          } > "$RUNNER_TEMP/mozconfig"
          cat "$RUNNER_TEMP/mozconfig"
          echo "MOZCONFIG=$RUNNER_TEMP/mozconfig" >> "$GITHUB_ENV"

      # One build ID for the whole job. Without it, make build and make package
      # each make their own, application.ini disagrees with the ID compiled
      # into the browser, and the Windows updater offers the same update again
      # after every install. The release writes update.xml from application.ini.
      - name: Pin the build ID
        run: echo "MOZ_BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          date -u
          make build
          date -u

      - name: Disk and memory after build
        if: ${{ !cancelled() }}
        run: |
          df -h
          free -h
          "$SCCACHE_PATH" --show-stats

      - name: Package
        run: make package

      - name: Report peak disk use
        if: ${{ !cancelled() }}
        run: |
          peak=$(sort -n "$RUNNER_TEMP/disk-samples" | tail -n 1)
          echo "Peak disk used on /: ${peak} MiB"
          echo "Peak disk used on /: ${peak} MiB" >> "$GITHUB_STEP_SUMMARY"
          df -h

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyberfox-linux-x86_64
          path: work/tree/obj-*/dist/*.linux-x86_64.tar.*
          if-no-files-found: error

  # Packages and installs the tarball this run just uploaded, in an Arch container.
  smoke:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/smoke-arch.yml
